name: Update Newsfeed

on:
  schedule:
    # 22:30 UTC = 4:00 AM IST
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic to add as a subsection (leave blank to keep the current one; "clear" to remove it)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: newsfeed-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate digest
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: python3 generate_digest.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest.json
          git diff --staged --quiet || git commit -m "Update newsfeed digest"
          git push
