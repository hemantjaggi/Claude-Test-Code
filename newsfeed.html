<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Newsfeed</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e6e4e0;
    --text: #1c1c1a;
    --muted: #6b6a65;
    --accent: #1c1c1a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1f1f24;
      --border: #303038;
      --text: #eceae6;
      --muted: #9a9a9f;
      --accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
    border-bottom: 2px solid var(--text);
    padding-bottom: 16px;
  }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .controls { display: flex; gap: 10px; align-items: center; }
  button#refresh {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }
  button#refresh:disabled { opacity: 0.5; cursor: default; }
  button#refresh:hover:not(:disabled) { opacity: 0.85; }

  .status { font-size: 13px; color: var(--muted); margin-bottom: 24px; min-height: 18px; }
  .status.error { color: #c0392b; }

  .topic-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .topic-row input {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
  }
  .topic-row button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }
  .topic-row button:hover:not(:disabled) { border-color: var(--text); }
  .topic-row button:disabled { opacity: 0.5; cursor: default; }

  nav.jump {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  nav.jump a {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
  }
  nav.jump a:hover { border-color: var(--text); color: var(--text); }

  section.category { margin-bottom: 36px; scroll-margin-top: 16px; }
  section.category h2 {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .item a.title {
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    display: block;
  }
  .item a.title:hover { text-decoration: underline; }
  .item .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .item .meta .covered { font-weight: 600; }
  .item .summary {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  .empty {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  .skeleton {
    height: 60px;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    margin-bottom: 10px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daily Newsfeed</h1>
      <div class="subtitle">Top 3 trending per section &middot; AI &middot; World &middot; Tech &middot; Sports &middot; India</div>
    </div>
    <div class="controls">
      <button id="refresh">Get Today's Digest</button>
    </div>
  </header>

  <div class="status" id="status"></div>

  <div class="topic-row">
    <input type="text" id="topic-input" placeholder="Add a topic (e.g. Cricket World Cup)" />
    <button id="topic-btn">Analyze</button>
  </div>

  <nav class="jump">
    <a href="#ai">AI</a>
    <a href="#world">World</a>
    <a href="#tech">Tech Companies</a>
    <a href="#sports">Sports</a>
    <a href="#india">India</a>
    <span id="nav-extra"></span>
  </nav>

  <section class="category" id="ai">
    <h2>AI</h2>
    <div class="list" data-list="ai"></div>
  </section>

  <section class="category" id="world">
    <h2>World</h2>
    <div class="list" data-list="world"></div>
  </section>

  <section class="category" id="tech">
    <h2>Tech Companies</h2>
    <div class="list" data-list="tech"></div>
  </section>

  <section class="category" id="sports">
    <h2>Sports</h2>
    <div class="list" data-list="sports"></div>
  </section>

  <section class="category" id="india">
    <h2>India</h2>
    <div class="list" data-list="india"></div>
  </section>

  <div id="custom-section-container"></div>
</div>

<script>
const CATEGORIES = ["ai", "world", "tech", "sports", "india"];
const refreshBtn = document.getElementById("refresh");
const statusEl = document.getElementById("status");
const topicInput = document.getElementById("topic-input");
const topicBtn = document.getElementById("topic-btn");
const navExtra = document.getElementById("nav-extra");
const customContainer = document.getElementById("custom-section-container");

let currentTopic = null;

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function itemsHtml(items) {
  if (!items || items.length === 0) {
    return '<div class="empty">No items available right now.</div>';
  }
  return items.map(item => {
    const coveredBy = (item.covered_by || []).join(", ");
    return `
    <div class="item">
      <a class="title" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
      <div class="meta">
        <span>${escapeHtml(item.source)}</span>
        ${item.time_ago ? `<span>&middot; ${escapeHtml(item.time_ago)}</span>` : ""}
        ${coveredBy ? `<span class="covered">&middot; Covered by ${escapeHtml(coveredBy)}</span>` : ""}
      </div>
      ${item.summary ? `<div class="summary">${escapeHtml(item.summary)}</div>` : ""}
    </div>
  `;
  }).join("");
}

function renderSkeletons() {
  CATEGORIES.forEach(cat => {
    const list = document.querySelector(`[data-list="${cat}"]`);
    list.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  });
  if (currentTopic) {
    const list = document.getElementById("custom-list");
    if (list) list.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  }
}

function renderCategory(cat, items) {
  document.querySelector(`[data-list="${cat}"]`).innerHTML = itemsHtml(items);
}

function renderCustomTopicSection(customTopic) {
  customContainer.innerHTML = "";
  navExtra.innerHTML = "";
  if (!customTopic || !customTopic.topic) return;

  navExtra.innerHTML = `<a href="#custom-topic">${escapeHtml(customTopic.topic)}</a>`;

  const section = document.createElement("section");
  section.className = "category";
  section.id = "custom-topic";
  section.innerHTML = `<h2>${escapeHtml(customTopic.topic)}</h2><div class="list" id="custom-list"></div>`;
  customContainer.appendChild(section);
  document.getElementById("custom-list").innerHTML = itemsHtml(customTopic.items);
}

async function loadDigest() {
  refreshBtn.disabled = true;
  topicBtn.disabled = true;
  refreshBtn.textContent = "Loading...";
  statusEl.textContent = "Fetching latest headlines...";
  statusEl.classList.remove("error");
  renderSkeletons();

  try {
    const qs = currentTopic ? `?topic=${encodeURIComponent(currentTopic)}` : "";
    const res = await fetch(`/api/news${qs}`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();

    CATEGORIES.forEach(cat => renderCategory(cat, data.categories[cat]));
    renderCustomTopicSection(data.custom_topic);

    const generated = new Date(data.generated_at);
    let msg = `Updated ${generated.toLocaleTimeString()}`;
    if (data.errors && data.errors.length > 0) {
      msg += ` — ${data.errors.length} source(s) unavailable`;
    }
    statusEl.textContent = msg;
  } catch (err) {
    statusEl.textContent = `Failed to load digest: ${err.message}`;
    statusEl.classList.add("error");
    CATEGORIES.forEach(cat => {
      const list = document.querySelector(`[data-list="${cat}"]`);
      list.innerHTML = '<div class="empty">Could not load.</div>';
    });
  } finally {
    refreshBtn.disabled = false;
    topicBtn.disabled = false;
    refreshBtn.textContent = "Get Today's Digest";
  }
}

refreshBtn.addEventListener("click", loadDigest);
topicBtn.addEventListener("click", () => {
  const topic = topicInput.value.trim();
  currentTopic = topic || null;
  loadDigest();
});
topicInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") topicBtn.click();
});
</script>
</body>
</html>
